<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="messagebox">
        <div th:if="${successMessage}" class="p-4 mb-4 text-green-800 rounded-lg bg-green-50 dark:bg-gray-800 dark:text-green-400">
            <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="p-4 mb-4 text-red-800 rounded-lg bg-red-50 dark:bg-gray-800 dark:text-red-400">
            <span th:text="${errorMessage}"></span>
        </div>
    </div>
</body>
</html>
